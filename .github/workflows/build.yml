name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SCONS_VERSION: 4.10.1

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          # - os: macos-latest
          #   platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodules
        shell: bash
        run: |
          test -f library/godot-cpp/SConstruct
          test -f library/fluidsynth/CMakeLists.txt

      # setup python/scons and the godot-cpp build environment
      - name: Setup godot-cpp
        uses: ./library/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.platform }}
          scons-version: ${{ env.SCONS_VERSION }}
          windows-compiler: msvc

      # platform dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build

      # - name: Install macOS dependencies # cmake 4.4.3 is already installed and up-to-date.; ninja 1.13.2 is already installed and up-to-date.
      #   if: matrix.platform == 'macos'
      #   shell: bash
      #   run: |
      #     brew install cmake ninja

      # - name: Install Windows dependencies # ninja v1.13.2 already installed.
      #   if: matrix.platform == 'windows'
      #   shell: pwsh
      #   run: |
      #     choco install ninja --yes

      # build
      - name: Build
        shell: bash
        run: |
          scons api_version=4.7
        env:
          PYTHON_BIN: python3

      - name: Verify build
        shell: bash
        run: |
          test -d addons/godot-fluidsynth/bin

          echo "Build output:"
          find addons/godot-fluidsynth/bin -type f -o -type l

      # output
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-fluidsynth-${{ matrix.platform }}
          path: addons/godot-fluidsynth
          if-no-files-found: error

  release:
    name: Package release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: godot-fluidsynth-linux
          path: package/addons/godot-fluidsynth

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: godot-fluidsynth-windows
          path: package/addons/godot-fluidsynth

      # - name: Download macOS build
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: godot-fluidsynth-macos
      #     path: package/addons/godot-fluidsynth

      - name: Show package contents
        shell: bash
        run: |
          echo "Package contents:"
          find package -type f -o -type l | sort

      - name: Create ZIP
        shell: bash
        run: |
          cd package
          zip -r ../godot-fluidsynth.zip addons/godot-fluidsynth

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: godot-fluidsynth-release
          path: godot-fluidsynth.zip
          if-no-files-found: error
